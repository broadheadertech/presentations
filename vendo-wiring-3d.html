<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laundry Vendo — Connection Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- iWash brand ---- */
  --iw-cyan:#03A2CB;
  --iw-cyan-lt:#4FC8E8;
  --iw-green:#7CA325;
  --iw-deep:#0A5D75;

  --ground:#132430;
  --ground-2:#0C1922;
  --rule:#25455A;
  --ink:#E6EDF3;
  --ink-dim:#8FA9B8;
  --ink-faint:#5A7688;

  /* the palette IS the wiring legend */
  --mains:#E0523B;
  --signal:#4FA8D8;
  --data:#52C48A;
  --sense:#B98BD9;
  --barrier:#F2B441;

  --display:'Barlow Condensed',Oswald,'Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ground-2)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0}

/* ---------- masthead ---------- */
.masthead{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:15px;
  padding:12px 24px 12px;
  border-bottom:1px solid var(--rule);
  background:linear-gradient(to bottom,rgba(12,25,34,.96),rgba(12,25,34,.72) 70%,rgba(12,25,34,0));
  pointer-events:none;
}
.badge{flex:none;display:block;height:40px;width:auto}
.masthead h1{
  font-family:var(--display);font-weight:600;font-size:20px;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--iw-cyan-lt);
}
.masthead .sep{color:var(--ink-faint)}
.masthead .sub{
  font-family:var(--mono);font-size:11px;color:var(--ink-dim);
  letter-spacing:.06em;
}
.rev{
  margin-left:auto;font-family:var(--mono);font-size:10px;
  color:var(--ink-faint);letter-spacing:.1em;text-align:right;line-height:1.6;
}

/* ---------- step rail ---------- */
.rail{
  position:fixed;left:0;top:64px;bottom:0;width:266px;z-index:15;
  /* bottom padding reserves the legend's footprint so steps never scroll under it */
  padding:22px 0 190px 24px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 190px),transparent calc(100% - 150px));
          mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 190px),transparent calc(100% - 150px));
}
.rail::-webkit-scrollbar{width:4px}
.rail::-webkit-scrollbar-thumb{background:var(--rule)}
.rail-hd{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:var(--ink-faint);text-transform:uppercase;margin-bottom:14px;
}
.step{
  display:flex;gap:12px;align-items:flex-start;
  padding:9px 14px 9px 0;cursor:pointer;
  border-left:2px solid transparent;padding-left:14px;margin-left:-16px;
  transition:border-color .2s,opacity .2s;opacity:.5;
}
.step:hover{opacity:.82}
.step.on{opacity:1;border-left-color:var(--accent,var(--ink))}
.step .n{
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);
  padding-top:3px;min-width:18px;
}
.step.on .n{color:var(--accent,var(--ink))}
.step .t{
  font-family:var(--display);font-size:16px;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;line-height:1.25;
}
.step .d{font-size:11.5px;color:var(--ink-dim);margin-top:3px;line-height:1.45}

/* ---------- legend ---------- */
.legend{
  position:fixed;left:24px;bottom:22px;z-index:18;
  display:flex;flex-direction:column;gap:7px;
  padding:14px 16px;background:#111820;
  border:1px solid var(--rule);
  box-shadow:0 -14px 26px rgba(17,24,32,.85);
}
.legend h3{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px;
}
.lg{display:flex;align-items:center;gap:9px;font-size:11.5px}
.lg i{width:16px;height:3px;border-radius:2px;flex:none}
.lg b{font-weight:500;font-size:11.5px}
.lg span{color:var(--ink-faint);font-family:var(--mono);font-size:10px;margin-left:auto;padding-left:14px}

/* ---------- detail panel ---------- */
.detail{
  position:fixed;right:24px;bottom:22px;width:352px;z-index:16;
  max-height:calc(100vh - 130px);overflow-y:auto;
  padding:20px 22px;background:#111820;
  border:1px solid var(--rule);border-top:2px solid var(--accent,var(--rule));
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.detail::-webkit-scrollbar{width:4px}
.detail::-webkit-scrollbar-thumb{background:var(--rule)}
.detail .eyebrow{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  color:var(--accent,var(--ink-dim));text-transform:uppercase;margin-bottom:8px;
}
.detail h2{
  font-family:var(--display);font-size:25px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;line-height:1.1;margin-bottom:10px;
}
.detail p{font-size:13px;line-height:1.62;color:var(--ink-dim)}
.detail p+p{margin-top:9px}
.detail .warn{
  margin-top:13px;padding:10px 12px;
  border-left:2px solid var(--barrier);background:rgba(242,180,65,.07);
  font-size:12px;line-height:1.55;color:#F0DDB4;
}
.detail .warn b{color:var(--barrier);font-weight:600}
.spec{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);
  display:grid;grid-template-columns:auto 1fr;gap:5px 16px;
  font-family:var(--mono);font-size:10.5px;
}
.spec dt{color:var(--ink-faint)}
.spec dd{color:var(--ink)}

/* ---------- nav ---------- */
.nav{
  position:fixed;right:24px;top:78px;z-index:17;display:flex;gap:6px;
}
.nav button{
  width:34px;height:34px;border:1px solid var(--rule);background:rgba(17,24,32,.86);
  color:var(--ink-dim);font-size:14px;cursor:pointer;font-family:var(--mono);
  transition:all .16s;
}
.nav button:hover:not(:disabled){border-color:var(--ink-dim);color:var(--ink)}
.nav button:disabled{opacity:.28;cursor:default}
.nav button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- 3d labels ---------- */
#labels{position:fixed;inset:0;z-index:12;pointer-events:none}
.lbl{
  position:absolute;transform:translate(0,-50%);
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  white-space:nowrap;opacity:0;transition:opacity .35s;
}
.lbl.on{opacity:1}
.lbl .bar{display:inline-block;width:22px;height:1px;vertical-align:middle;margin-right:7px}
.lbl.flip{direction:rtl}
.lbl.flip>*{direction:ltr}
.lbl.flip .bar{margin-right:0;margin-left:7px}
.lbl .txt{padding:2px 7px;background:rgba(17,24,32,.88);border:1px solid var(--rule)}
.lbl .txt b{display:block;font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

.hint{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:16;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.08em;
}

@media (max-width:1100px){
  .rail{display:none} .legend{display:none}
  .detail{right:16px;left:16px;width:auto;bottom:16px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
</style>
</head>

/* iWash logo texture, loaded from the embedded PNG */
let _logoTex = null;
function makeBadgeTexture(){
  if(_logoTex) return _logoTex;
  _logoTex = new THREE.TextureLoader().load(IWASH_LOGO);
  _logoTex.anisotropy = 8;
  _logoTex.minFilter = THREE.LinearFilter;
  return _logoTex;
}

/* the machine's QR sticker -- real logo composited over a generated card */
function makeStickerTexture(){
  const S = 4, W = 148, H = 200;
  const cv = document.createElement('canvas');
  cv.width = W*S; cv.height = H*S;
  const g = cv.getContext('2d');
  g.scale(S,S);

  g.fillStyle = '#FFFFFF'; g.fillRect(0,0,W,H);
  g.fillStyle = '#03A2CB'; g.fillRect(0,0,W,46);
  g.fillStyle = '#7CA325'; g.fillRect(0,46,W,4);

  // machine number
  g.fillStyle = '#0A5D75'; g.fillRect(0,50,W,32);
  g.fillStyle = '#FFFFFF';
  g.textAlign = 'center';
  g.font = '700 28px "Barlow Condensed","Arial Narrow",sans-serif';
  g.fillText('WASHER 04', W/2, 74);

  // QR -- representative pattern, NOT a scannable code
  const qx = 34, qy = 90, qs = 78, m = 25, c = qs/m;
  g.fillStyle = '#0A5D75';
  function finder(fx,fy){
    g.fillStyle='#0A5D75'; g.fillRect(qx+fx*c, qy+fy*c, c*7, c*7);
    g.fillStyle='#FFF';    g.fillRect(qx+(fx+1)*c, qy+(fy+1)*c, c*5, c*5);
    g.fillStyle='#0A5D75'; g.fillRect(qx+(fx+2)*c, qy+(fy+2)*c, c*3, c*3);
  }
  let seed = 7;
  for(let y=0;y<m;y++) for(let x=0;x<m;x++){
    if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16)) continue;
    seed = (seed*1103515245 + 12345) & 0x7fffffff;
    if((seed>>16)&1){ g.fillStyle='#0A5D75'; g.fillRect(qx+x*c, qy+y*c, c, c); }
  }
  finder(0,0); finder(18,0); finder(0,18);

  g.fillStyle = '#0A5D75';
  g.font = '700 14px "Barlow Condensed","Arial Narrow",sans-serif';
  g.fillText('SCAN TO WASH', W/2, 184);
  g.fillStyle = '#6B8494';
  g.font = '400 9px Inter, system-ui, sans-serif';
  g.fillText('GCash  ·  Maya  ·  QR Ph', W/2, 195);

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 8;

  // composite the real logo into the header band once it decodes
  const img = new Image();
  img.onload = function(){
    const lw = 74, lh = lw * (img.height/img.width);
    g.drawImage(img, (W-lw)/2, (46-lh)/2, lw, lh);
    tex.needsUpdate = true;
  };
  img.src = IWASH_LOGO;

  return tex;
}

const cables = {};
function cable(name, pts, color, radius, dashed){
  const curve = new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve, 64, radius||.035, 8, false);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color:color, roughness:.7, emissive:color, emissiveIntensity:.12
  }));
  m.visible = false; scene.add(m);
  cables[name] = {mesh:m, curve:curve, color:color, flows:[], dashed:!!dashed};
  return cables[name];
}

/* flow particles */
function makeFlow(key, n, color){
  const c = cables[key]; if(!c) return;
  for(let i=0;i<n;i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(.032,8,8),
      new THREE.MeshBasicMaterial({color:color||c.color}));
    s.userData.t = i/n; s.visible=false; scene.add(s);
    c.flows.push(s);
  }
}

let cur = 0;
const camPos = new THREE.Vector3(), camTgt = new THREE.Vector3();
const wantPos = new THREE.Vector3(), wantTgt = new THREE.Vector3();
let orbitYaw=0, orbitPitch=0, zoom=1, userOrbit=false;

const railEl = document.getElementById('steps');
STEPS.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className='step'; d.style.setProperty('--accent','var('+s.accent+')');
  d.innerHTML = '<span class="n">'+String(i).padStart(2,'0')+'</span>'+
    '<span><span class="t">'+s.t+'</span><span class="d">'+s.d+'</span></span>';
  d.onclick = ()=>go(i);
  railEl.appendChild(d);
});

function go(i){
  cur = Math.max(0, Math.min(STEPS.length-1, i));
  const s = STEPS[cur];
  userOrbit=false; orbitYaw=0; orbitPitch=0; zoom=1;

  wantPos.set(...s.cam); wantTgt.set(...s.tgt);
  if(REDUCED){ camPos.copy(wantPos); camTgt.copy(wantTgt); }

  const sh = s.show;
  Object.keys(cables).forEach(k=>{
    const on = !!sh[k]; cables[k].mesh.visible = on;
    cables[k].flows.forEach(f=>f.visible = on);
  });
  ct.visible = !!sh.ct;
  net.visible = !!sh.net;
  rf.forEach(r=>{ r.mesh.visible = !!sh.rf; r.flows.forEach(f=>f.visible=!!sh.rf); });

  boxGuts.visible = !!sh.guts;
  boxLid.children.forEach(c=>{
    if(!c.material) return;
    if(c.name === 'badge'){
      // logo decal keeps its alpha at all times; only its opacity fades
      c.material.transparent = true;
      c.material.opacity = sh.guts ? .22 : 1;
      c.material.depthWrite = false;
      return;
    }
    c.material.transparent = !!sh.guts;
    c.material.opacity = sh.guts ? .17 : 1;
    c.material.depthWrite = !sh.guts;
  });
  const bar = boxGuts.getObjectByName('barrier');
  const bare = boxGuts.getObjectByName('barrierEdge');
  if(bar){ bar.material.opacity = sh.barrier ? .38 : .1; }
  if(bare){ bare.material.opacity = sh.barrier ? 1 : .3; bare.material.transparent = true; }

  LABELS.forEach(l=> l.el.classList.toggle('on', l.steps.indexOf(cur)>=0));

  const dt = document.getElementById('detail');
  dt.style.setProperty('--accent','var('+s.accent+')');
  dt.innerHTML =
    '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+
    s.body.map(p=>'<p>'+p+'</p>').join('')+
    (s.warn?'<div class="warn">'+s.warn+'</div>':'')+
    (s.specs?'<dl class="spec">'+s.specs.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')+'</dl>':'');

  [...railEl.children].forEach((c,i2)=>c.classList.toggle('on', i2===cur));
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===STEPS.length-1;
}
document.getElementById('prev').onclick = ()=>go(cur-1);
document.getElementById('next').onclick = ()=>go(cur+1);
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); go(cur+1); }
  if(e.key==='ArrowLeft') { e.preventDefault(); go(cur-1); }
});

/* --- hand-rolled orbit --- */
let dragging=false, lx=0, ly=0;
renderer.domElement.addEventListener('pointerdown', e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup', ()=>dragging=false);
addEventListener('pointermove', e=>{
  if(!dragging) return;
  userOrbit=true;
  orbitYaw   -= (e.clientX-lx)*0.006;
  orbitPitch  = Math.max(-.9, Math.min(1.2, orbitPitch + (e.clientY-ly)*0.005));
  lx=e.clientX; ly=e.clientY;
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault(); userOrbit=true;
  zoom = Math.max(.45, Math.min(2.2, zoom + e.deltaY*0.0012));
},{passive:false});

const ndc = new THREE.Vector3();
function tick(t){
  requestAnimationFrame(tick);

  const k = REDUCED ? 1 : .055;
  camTgt.lerp(wantTgt, k);

  const base = wantPos.clone().sub(wantTgt);
  if(userOrbit){
    const r = base.length()*zoom;
    const yaw0 = Math.atan2(base.x, base.z);
    const pit0 = Math.asin(base.y/base.length());
    const yaw = yaw0 + orbitYaw, pit = Math.max(-.5,Math.min(1.25,pit0 + orbitPitch));
    base.set(Math.sin(yaw)*Math.cos(pit)*r, Math.sin(pit)*r, Math.cos(yaw)*Math.cos(pit)*r);
  }
  camPos.lerp(camTgt.clone().add(base), k);
  camera.position.copy(camPos);
  camera.lookAt(camTgt);

  if(!REDUCED){
    const sp = (t||0)*0.00016;
    Object.keys(cables).forEach(key=>{
      const c = cables[key];
      c.flows.forEach(f=>{
        if(!f.visible) return;
        const u = (f.userData.t + sp) % 1;
        f.position.copy(c.curve.getPointAt(u));
      });
    });
    rf.forEach(r=>r.flows.forEach(f=>{
      if(!f.visible) return;
      const u = (f.userData.t + sp*1.6) % 1;
      f.position.copy(r.curve.getPointAt(u));
    }));
    const bar = boxGuts.getObjectByName('barrier');
    if(bar && bar.visible && STEPS[cur].show.barrier){
      bar.material.opacity = .28 + Math.sin((t||0)*0.0022)*.12;
    }
  }

  // panel footprints the labels must stay clear of
  const wide = innerWidth > 1100;
  const zones = [
    {x0:0, y0:0, x1:innerWidth, y1:64},                              // masthead
    {x0:innerWidth-420, y0:70, x1:innerWidth, y1:120},               // nav buttons
    {x0:innerWidth-400, y0:innerHeight-300, x1:innerWidth, y1:innerHeight}  // detail
  ];
  if(wide){
    zones.push({x0:0, y0:64, x1:280, y1:innerHeight});               // rail + legend
  }
  const blocked = (x,y)=> zones.some(z=> x>z.x0 && x<z.x1 && y>z.y0 && y<z.y1);

  LABELS.forEach(l=>{
    if(!l.el.classList.contains('on')) return;
    ndc.copy(l.v).project(camera);
    if(ndc.z>1){ l.el.style.display='none'; return; }

    const x = (ndc.x*.5+.5)*innerWidth, y = (-ndc.y*.5+.5)*innerHeight;
    const w = l.el.offsetWidth || 150, h = l.el.offsetHeight || 34;

    // flip to the left of the anchor if the label would overhang the right edge
    const flip = x + w + 16 > innerWidth;
    const lx = flip ? x - w : x;
    l.el.classList.toggle('flip', flip);

    // hide if either end of the label lands on a panel, or it runs off-screen
    const hide = blocked(lx, y) || blocked(lx+w, y) ||
                 blocked(lx, y-h/2) || blocked(lx+w, y+h/2) ||
                 lx < 4 || y < 4 || y > innerHeight-4;

    l.el.style.left = lx+'px';
    l.el.style.top  = y+'px';
    l.el.style.display = hide ? 'none' : 'block';
  });

  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

camPos.set(...STEPS[0].cam); camTgt.set(...STEPS[0].tgt);
go(0);
tick(0);
})();
</script>
</body>
</html>
